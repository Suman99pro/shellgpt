<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShellGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0e;
    --surface: #111417;
    --border: #1e2328;
    --border-bright: #2a3038;
    --green: #00ff88;
    --green-dim: #00cc6a;
    --green-glow: rgba(0,255,136,0.12);
    --amber: #ffb800;
    --amber-dim: rgba(255,184,0,0.15);
    --red: #ff4455;
    --text: #c8d0da;
    --text-dim: #5a6472;
    --text-bright: #eef0f3;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 36px; height: 36px;
    border: 2px solid var(--green);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--green);
    box-shadow: 0 0 12px var(--green-glow);
    flex-shrink: 0;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--green); }

  .header-tag {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .tagline {
    text-align: center;
    margin-bottom: 48px;
  }

  .tagline h1 {
    font-family: var(--mono);
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 10px;
    letter-spacing: -1px;
  }

  .tagline h1 .accent { color: var(--green); }

  .tagline p {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 300;
  }

  /* Input section */
  .input-block {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 28px;
    transition: border-color 0.2s;
  }

  .input-block:focus-within {
    border-color: var(--green-dim);
    box-shadow: 0 0 0 1px var(--green-glow), 0 0 24px var(--green-glow);
  }

  .input-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .input-label::before {
    content: '>';
    opacity: 0.6;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 400;
    color: var(--text-bright);
    line-height: 1.6;
    min-height: 72px;
    caret-color: var(--green);
  }

  textarea::placeholder { color: var(--text-dim); font-weight: 300; }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .example-chip {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border-bright);
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .example-chip:hover {
    color: var(--green);
    border-color: var(--green-dim);
    background: var(--green-glow);
  }

  .generate-btn {
    background: var(--green);
    color: #000;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .generate-btn:hover:not(:disabled) {
    background: #1affa0;
    box-shadow: 0 0 20px var(--green-glow);
  }

  .generate-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    display: none;
    animation: spin 0.6s linear infinite;
  }

  .generate-btn.loading .spinner { display: block; }
  .generate-btn.loading .btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  .result-block {
    display: none;
    animation: slideIn 0.3s ease;
  }

  .result-block.visible { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-terminal {
    background: #070909;
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .terminal-bar {
    background: var(--surface);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }

  .terminal-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 6px;
    flex: 1;
    text-align: center;
  }

  .copy-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border-bright);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: auto;
  }

  .copy-btn:hover { color: var(--green); border-color: var(--green-dim); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  .terminal-body {
    padding: 20px 24px;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
  }

  .terminal-prompt {
    color: var(--green);
    margin-bottom: 4px;
    font-size: 12px;
  }

  .terminal-command {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    word-break: break-all;
  }

  .meta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .meta-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .meta-card.full { grid-column: 1 / -1; }

  .meta-card-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .meta-card-value {
    font-size: 14px;
    color: var(--text-bright);
    line-height: 1.5;
    font-weight: 400;
  }

  .os-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .os-linux { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
  .os-macos { color: #58c4f5; border-color: #58c4f5; background: rgba(88,196,245,0.1); }
  .os-both { color: var(--green); border-color: var(--green-dim); background: var(--green-glow); }

  .warning-card {
    background: rgba(255,184,0,0.06);
    border: 1px solid rgba(255,184,0,0.25);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .warning-icon { color: var(--amber); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .warning-text { font-size: 13px; color: #d4a800; line-height: 1.5; }

  .error-block {
    display: none;
    background: rgba(255,68,85,0.06);
    border: 1px solid rgba(255,68,85,0.3);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--red);
    margin-bottom: 12px;
  }

  .error-block.visible { display: block; }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">$_</div>
  <div class="logo-text">Shell<span>GPT</span></div>
  <div class="header-tag">v1.0.0 · gpt-4o</div>
</header>

<main>
  <div class="tagline">
    <h1>Natural language <span class="accent">→</span> Shell command</h1>
    <p>Describe what you want to do. Get the exact command.</p>
  </div>

  <div class="input-block">
    <div class="input-label">Describe your task</div>
    <textarea id="prompt" rows="3" placeholder="e.g. Find all files larger than 100MB modified in the last 7 days"></textarea>
    <div class="input-footer">
      <div class="examples">
        <button class="example-chip" onclick="setExample(this)">compress a folder with tar</button>
        <button class="example-chip" onclick="setExample(this)">kill process on port 8080</button>
        <button class="example-chip" onclick="setExample(this)">watch docker logs live</button>
        <button class="example-chip" onclick="setExample(this)">list open ports</button>
      </div>
      <button class="generate-btn" id="generateBtn" onclick="generate()">
        <div class="spinner"></div>
        <span class="btn-label">Generate ⏎</span>
      </button>
    </div>
  </div>

  <div class="error-block" id="errorBlock"></div>

  <div class="result-block" id="resultBlock">
    <div class="result-terminal">
      <div class="terminal-bar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <div class="terminal-title">bash — shellgpt output</div>
        <button class="copy-btn" id="copyBtn" onclick="copyCommand()">copy</button>
      </div>
      <div class="terminal-body">
        <div class="terminal-prompt">user@host:~$</div>
        <div class="terminal-command" id="commandOutput"></div>
      </div>
    </div>

    <div id="warningCard" class="warning-card" style="display:none">
      <div class="warning-icon">⚠</div>
      <div class="warning-text" id="warningText"></div>
    </div>

    <div class="meta-row">
      <div class="meta-card">
        <div class="meta-card-label">Explanation</div>
        <div class="meta-card-value" id="explanationOutput"></div>
      </div>
      <div class="meta-card">
        <div class="meta-card-label">Compatible OS</div>
        <div class="meta-card-value" id="osOutput"></div>
      </div>
    </div>
  </div>
</main>

<footer>ShellGPT — powered by OpenAI · use responsibly</footer>

<script>
  const promptEl = document.getElementById("prompt");
  const btn = document.getElementById("generateBtn");
  const resultBlock = document.getElementById("resultBlock");
  const errorBlock = document.getElementById("errorBlock");
  let lastCommand = "";

  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
  });

  function setExample(el) {
    promptEl.value = el.textContent;
    promptEl.focus();
  }

  async function generate() {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    btn.classList.add("loading");
    btn.disabled = true;
    errorBlock.classList.remove("visible");
    resultBlock.classList.remove("visible");

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();

      if (!res.ok || data.error) throw new Error(data.error || "Unknown error");

      lastCommand = data.command;
      document.getElementById("commandOutput").textContent = data.command;
      document.getElementById("explanationOutput").textContent = data.explanation;

      const osEl = document.getElementById("osOutput");
      const osClass = { linux: "os-linux", macos: "os-macos", both: "os-both" }[data.os] || "os-both";
      osEl.innerHTML = `<span class="os-badge ${osClass}">${data.os || "linux"}</span>`;

      const warningCard = document.getElementById("warningCard");
      if (data.warnings && data.warnings !== "null" && data.warnings !== null) {
        document.getElementById("warningText").textContent = data.warnings;
        warningCard.style.display = "flex";
      } else {
        warningCard.style.display = "none";
      }

      document.getElementById("copyBtn").textContent = "copy";
      document.getElementById("copyBtn").classList.remove("copied");
      resultBlock.classList.add("visible");
    } catch (err) {
      errorBlock.textContent = "Error: " + err.message;
      errorBlock.classList.add("visible");
    } finally {
      btn.classList.remove("loading");
      btn.disabled = false;
    }
  }

  function copyCommand() {
    if (!lastCommand) return;
    navigator.clipboard.writeText(lastCommand).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.textContent = "copied ✓";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 2000);
    });
  }
</script>
</body>
</html>
